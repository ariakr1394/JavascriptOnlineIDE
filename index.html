
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>JavaScript Online IDE</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>JavaScript Online IDE</h1>
        <br>
        <div class="editor"><textarea class="textbox" id="text" placeholder="Type JavaScript..."></textarea><button class="button" id="run">Run (Ctrl + Enter)</button><button id="clear" class="button">Clear Console</button></div>
        <br>
        <div class="console" id="console">
        <br>
        </div>
        <br>
        <script src="javascript.js"></script>
        <iframe id="sandbox" sandbox="allow-scripts" hidden></iframe>
    </body>
</html>
